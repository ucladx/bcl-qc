# Install with: conda env create -f config/nf_env.yaml
# DRAGEN is provided by the server. Keep Plotly/Kaleido pinned for MultiQC export.
name: bclqc-nf
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.4
  - openjdk=22.0.1
  - nextflow=26.04.6
  - multiqc=1.23
  - picard=3.3.0
  - r-base=4.4.1
  - numpy=2.0.0
  - pyyaml=6.0.1
  - perl=5.32.1
  - plotly=5.22.0
  - python-kaleido=0.2.1
  - kaleido-core=0.2.1
  - click=8.1.7
  - coloredlogs=15.0.1
  - colormath=3.0.0
  - humanize=4.10.0
  - importlib-metadata=8.0.0
  - jinja2=3.1.4
  - markdown=3.6
  - packaging=24.1
  - pillow=10.4.0
  - pyaml-env=1.2.1
  - pydantic=2.8.2
  - requests=2.32.3
  - rich=13.7.1
  - rich-click=1.8.3
  - spectra=0.0.11
  - tqdm=4.66.4
  - typeguard=4.3.0
  - pip
  - pip:
      - interop==1.3.2
      - pandas==2.2.2
      - matplotlib==3.9.1
      - seaborn==0.13.2
